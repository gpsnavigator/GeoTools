# Cloudflare Worker that stores GeoTools session logs as JSON files in the GitHub repo's `data` branch.
# Deploy: see backend/session-logger/README.md
name = "geotools-session-logger"
main = "src/worker.js"
compatibility_date = "2025-01-01"

[vars]
# Repository and branch the session JSON files are committed to.
GITHUB_REPO = "gpsnavigator/GeoTools"
GITHUB_BRANCH = "data"
# Comma-separated origins allowed to send logs (the Pages site and the local dev server).
ALLOWED_ORIGINS = "https://gpsnavigator.github.io,http://localhost:5173"

# Secret (never in this file): GITHUB_TOKEN -- a fine-grained personal access token limited to this repository
# with "Contents: Read and write". Set it with:  npx wrangler secret put GITHUB_TOKEN
